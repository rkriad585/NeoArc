{% extends 'base.html' %}
{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="glass-panel rounded-3xl p-8 md:p-12 w-full max-w-md relative overflow-hidden group">
        <!-- Accent line -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-nothingRed to-transparent opacity-50 group-hover:opacity-100 transition-opacity"></div>
        
        <h2 class="font-display text-3xl mb-2 text-white">LOGIN</h2>
        <p class="font-mono text-xs text-gray-400 mb-8">Authenticate to access NeoArc Nodes..</p>

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="font-display text-sm text-gray-300 block mb-2">Username</label>
                <input type="text" name="username" required 
                       class="w-full bg-black/40 border border-glassBorder rounded-2xl px-4 py-3 text-white font-mono focus:outline-none focus:border-nothingRed focus:ring-1 focus:ring-nothingRed transition-all">
            </div>
            <div>
                <label class="font-display text-sm text-gray-300 block mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full bg-black/40 border border-glassBorder rounded-2xl px-4 py-3 text-white font-mono focus:outline-none focus:border-nothingRed focus:ring-1 focus:ring-nothingRed transition-all">
            </div>
            <button type="submit" class="w-full bg-white text-black font-display text-lg py-3 rounded-full hover:bg-nothingRed hover:text-white transition-all shadow-lg hover:shadow-nothingRed/50 mt-4 flex justify-center items-center gap-2 group">
                <!-- Login Gateway Icon -->
                <svg class="w-4 h-4 text-white group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Login
            </button>
        </form>
        
        <div class="mt-6 text-center font-mono text-xs text-gray-500 flex flex-col gap-2">
            <a href="{{ url_for('auth.forgot_password') }}" class="text-gray-400 hover:text-nothingRed underline decoration-nothingRed underline-offset-4">Forgot password?</a>
            <span>No access node? <a href="{{ url_for('auth.register') }}" class="text-white hover:text-nothingRed underline decoration-nothingRed underline-offset-4">Register here.</a></span>
        </div>
    </div>
</div>
{% endblock %}
