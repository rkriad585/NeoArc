<!DOCTYPE html>
<html>
<head>
    <title>NeoArc Admin</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-red-500">SUPER ADMIN</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Admin Email" class="w-full mb-4 p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-red-500">
            <input type="password" name="password" placeholder="Password" class="w-full mb-6 p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-red-500">
            <button class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded">ACCESS CONTROL</button>
        </form>
    </div>
</body>
</html>
