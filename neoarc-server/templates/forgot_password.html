{% extends 'base.html' %}
{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="glass-panel rounded-3xl p-8 md:p-12 w-full max-w-md relative overflow-hidden group">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-nothingRed to-transparent opacity-50 group-hover:opacity-100 transition-opacity"></div>
        
        <h2 class="font-display text-3xl mb-2 text-white">RECOVER</h2>
        <p class="font-mono text-xs text-gray-400 mb-8">Request a password reset link..</p>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="font-display text-sm text-gray-300 block mb-2">SECURE EMAIL</label>
                <input type="email" name="email" required placeholder="node@matrix.com"
                       class="w-full bg-black/40 border border-glassBorder rounded-2xl px-4 py-3 text-white font-mono focus:outline-none focus:border-nothingRed focus:ring-1 focus:ring-nothingRed transition-all">
            </div>
            <button type="submit" class="w-full border border-white text-white font-display text-lg py-3 rounded-full hover:bg-white hover:text-black transition-all shadow-lg mt-4 flex justify-center items-center gap-2 group">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                SEND RESET LINK
            </button>
        </form>
        
        <div class="mt-6 text-center font-mono text-xs text-gray-500">
            Remember your credentials? <a href="{{ url_for('index') }}" class="text-white hover:text-nothingRed underline decoration-nothingRed underline-offset-4">Login here.</a>
        </div>
    </div>
</div>
{% endblock %}
